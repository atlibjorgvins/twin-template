<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/logo/mark.svg" />
    <link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/logo/mark.svg" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Helga: light by default; dark theme is opt-in via data-theme="dark". -->
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>Hub</title>
    <!-- Flash-free theme init. Runs before first paint so the user
         never sees the default light theme flicker into dark. Mirrors
         the logic in src/lib/theme.svelte.ts; keep them in sync. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('twin.theme') || 'auto';
          var dark =
            mode === 'dark' ||
            (mode === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
          var scope = localStorage.getItem('twin.scope') || 'all';
          if (scope === 'work' || scope === 'private')
            document.documentElement.setAttribute('data-scope', scope);
          // Accent preset — mirrors src/lib/profile.svelte.ts; keep in sync.
          var accent = localStorage.getItem('twin.accent');
          if (accent) document.documentElement.setAttribute('data-accent', accent);
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body class="bg-surface-page text-ink-900 font-sans antialiased">
    <!-- Vault-switch curtain. A vault swap is a full reload by contract (the
         repo is a per-load singleton), and the reload gap used to show as a
         white flash. This paints a themed cover with the destination's name
         BEFORE the bundle loads; vaultSwitch.ts (finishVaultSwitch) fades it
         out once the new vault has booted. Inline on purpose: it must exist
         while no JS bundle does. -->
    <!-- display:none INLINE and toggled INLINE — never `hidden`: an inline
         display beats the [hidden] UA rule, which shipped exactly once as an
         always-on white curtain over the whole app (v1.3.0). -->
    <div id="vault-switch-curtain"
         style="display: none; position: fixed; inset: 0; z-index: 9999; align-items: center; justify-content: center; background: #fafafa; color: #666; font: 500 14px system-ui, sans-serif; letter-spacing: 0.02em; transition: opacity 200ms ease;">
      <span id="vault-switch-label"></span>
    </div>
    <script>
      (function () {
        try {
          var raw = sessionStorage.getItem('twin.vaultSwitch');
          if (!raw) return;
          var d = JSON.parse(raw);
          var el = document.getElementById('vault-switch-curtain');
          if (document.documentElement.getAttribute('data-theme') === 'dark') {
            el.style.background = '#0a0a0a';
            el.style.color = '#999';
          }
          // textContent, never markup: the name is user data.
          document.getElementById('vault-switch-label').textContent = 'Opening ' + (d.name || 'vault') + '…';
          el.style.display = 'flex';
        } catch (e) {
          /* no curtain is only cosmetic */
        }
      })();
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
