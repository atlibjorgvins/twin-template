# The Twin desktop shell — a Tauri v2 wrapper around the static SPA in
# ../build, built with PUBLIC_DATA_BACKEND=local (see ../.env.desktop): every
# row lives in the app WebView's IndexedDB, no server anywhere.
# `npm run dmg` builds the installer.
[package]
name = "twin-desktop"
version = "1.15.0"
description = "Twin — a personal contact system"
edition = "2021"

[lib]
name = "twin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Desktop-only plugins: a global keyboard shortcut and window geometry
# persistence have no meaning on iOS/Android (no global hotkeys, no windows),
# and the crates don't build for mobile targets. cfg(desktop) isn't a Cargo
# cfg, so gate by the concrete desktop OSes.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"

[profile.release]
# Smaller binary: the shell does nothing but host the WebView.
strip = true
lto = true
codegen-units = 1
